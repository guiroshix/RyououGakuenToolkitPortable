name: Build UMD-Replace

on: [push, pull_request]

jobs:
  build:
  
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Compile for Linux
      run: gcc UMD-replace.c -o UMD-replace-linux -O3
      
    - name: Compile for Windows (x86_64)
      run: |
        sudo apt-get install -y mingw-w64
        x86_64-w64-mingw32-gcc UMD-replace.c -o UMD-replace.exe -O3
        
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: umd-replace-binaries
        path: |
          umd-replace-linux
          umd-replace.exe
